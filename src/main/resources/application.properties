# 连接用户已经创建的商城数据库，密码不写在文件中。
db.url=jdbc:mysql://127.0.0.1:18306/sports_mall?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.user=root
db.poolSize=2
# 密码由当前 PowerShell 的 MALL_DB_PASSWORD 传入。
# 同一商城的文档数据库；连接凭据以后需要时通过 MALL_MONGO_URI 传入。
mongo.uri=mongodb://127.0.0.1:27017
mongo.database=sports_mall
mongo.timeoutMs=5000
